name: Debug Deep Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Probe a sample with deep diagnostics
        working-directory: pipeline
        run: python debug_deep.py
