name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker unit tests
        working-directory: worker
        run: npm test
