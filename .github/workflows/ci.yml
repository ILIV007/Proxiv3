name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker unit tests
        working-directory: worker
        run: npm test
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt pytest
      - name: Pipeline unit tests
        working-directory: pipeline
        run: python -m pytest tests/ -q

  telethon-xcheck:
    # Temporary diagnostic: Telethon (production MTProto client) vs our
    # deep probe on the same public proxies. Always exits 0; read the log.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt telethon
      - name: Telethon vs deep cross-check
        working-directory: pipeline
        run: python telethon_xcheck.py

  pipeline-smoke:
    # One real end-to-end run (1 round) on GitHub's clean egress — this is
    # what validates the MTProto prober; some sandboxes mangle raw TCP and
    # cannot. Publishes nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Live pipeline (1 round)
        working-directory: pipeline
        run: python -m pool --out /tmp/out --rounds 1 --gap 0 --timeout 6
      - name: Smoke assertion — the prober must verify a real pool
        run: |
          python3 - <<'EOF'
          import json
          i = json.load(open("/tmp/out/index.json"))
          print(i["funnel"])
          assert i["funnel"]["verified_servers"] >= 100, "prober verified too few servers"
          EOF
